name: Validate TabTools localisation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'build.ps1'
      - 'website/src/**'
      - 'website/dist/**'
      - 'localisation/**'
      - 'marketing/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/localisation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.js'
      - 'build.ps1'
      - 'website/src/**'
      - 'website/dist/**'
      - 'localisation/**'
      - 'marketing/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/localisation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Generate committed localisation outputs
        run: |
          node scripts/generate-extension-locales.js
          node scripts/generate-website.js
          node scripts/generate-listings.js
      - name: Validate localisation
        run: node scripts/validate-localisation.js
      - name: Run regression tests
        run: node --test tests/website.test.js tests/localisation.test.js
      - name: Build all browser packages
        run: node build.js
      - name: Reject stale generated files
        run: git diff --exit-code
