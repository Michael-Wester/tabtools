name: Website mobile checks

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    # The complete localized-guide matrix takes about 14 minutes including
    # browser installation; leave room for ordinary runner variation.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/tests/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Check responsive layouts and interactions
        run: |
          npm run test:guides -- --project=chromium-guides-desktop --project=webkit-guides-desktop
          npm test
      - name: Upload review screenshots and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-mobile-results
          path: |
            website/tests/playwright-report/
            website/tests/test-results/
          retention-days: 7
